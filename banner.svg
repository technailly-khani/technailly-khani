<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Javeria Khan, curly code and twisty ideas" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A1650"/>
      <stop offset="1" stop-color="#7A2E78"/>
    </linearGradient>
    <path id="titlePath" d="M120 160 C240 70 330 240 450 160 S660 80 780 160"/>
  </defs>
  <style>
    .brace { font-family: Georgia, 'Times New Roman', serif; font-size: 200px; fill: #FFB38A; }
    .b1 { animation: bob 4s ease-in-out infinite; }
    .b2 { animation: bob 4s ease-in-out infinite reverse; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .curl { fill: none; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 7s ease-in-out infinite; }
    .c2 { animation-delay: 1.2s; }
    .c3 { animation-delay: 2.4s; }
    @keyframes draw { 0% { stroke-dashoffset: 600; } 40%,70% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -600; } }
    .title { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 60px; fill: #FFF3E4; }
    .sub { font-family: Georgia, 'Times New Roman', serif; font-size: 19px; fill: #7FE0C3; letter-spacing: 1.5px; }
    @media (prefers-reduced-motion: reduce) {
      .b1, .b2, .curl { animation: none; }
      .curl { stroke-dashoffset: 0; }
    }
  </style>
  <rect width="900" height="300" rx="24" fill="url(#bg)"/>

  <text class="brace b1" x="28" y="235">{</text>
  <text class="brace b2" x="800" y="235">}</text>

  <path class="curl" stroke="#7FE0C3" d="M200 78 c0 -28 -38 -28 -38 0 c0 38 60 38 60 -6 c0 -50 -82 -50 -82 6 c0 62 104 62 104 -8"/>
  <path class="curl c2" stroke="#FFB38A" d="M700 78 c0 -28 38 -28 38 0 c0 38 -60 38 -60 -6 c0 -50 82 -50 82 6 c0 62 -104 62 -104 -8"/>
  <path class="curl c3" stroke="#E7A6EE" d="M90 272 q30 -44 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>

  <text class="title"><textPath href="#titlePath" startOffset="50%" text-anchor="middle">Javeria Khan</textPath></text>
  <text class="sub" x="450" y="232" text-anchor="middle">BSAI student at SZABIST Hyderabad, writing curly code and twisty ideas</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
