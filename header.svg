<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Javeria Khan, curly code and twisty ideas" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0a14"/>
      <stop offset="0.55" stop-color="#1c0b2b"/>
      <stop offset="1" stop-color="#3a0d3f"/>
    </linearGradient>
    <linearGradient id="pk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="titlePath" d="M150 108 C260 38 340 178 450 108 S640 38 750 108"/>
  </defs>
  <style>
    .brace { font-family: Georgia, 'Times New Roman', serif; font-size: 170px; fill: #ff4fa3; opacity: .85; }
    .b1 { animation: bob 4.5s ease-in-out infinite; }
    .b2 { animation: bob 4.5s ease-in-out infinite reverse; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .flow { fill: none; stroke-width: 3.5; stroke-linecap: round; animation: slide 9s linear infinite; }
    .f2 { animation-duration: 14s; animation-direction: reverse; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(240px); } }
    .curl { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 7s ease-in-out infinite; }
    .c2 { animation-delay: 1.5s; }
    @keyframes draw { 0% { stroke-dashoffset: 600; } 40%,70% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -600; } }
    .title { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 56px; fill: #ffd1ea; }
    .sub { font-family: 'Courier New', Courier, monospace; font-size: 17px; fill: #c9b6ff; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .b1, .b2, .flow, .curl, .cur { animation: none; }
      .curl { stroke-dashoffset: 0; }
    }
  </style>
  <rect width="900" height="260" rx="22" fill="url(#bg)"/>

  <text class="brace b1" x="22" y="190" filter="url(#glow)">{</text>
  <text class="brace b2" x="812" y="190" filter="url(#glow)">}</text>

  <path class="curl" stroke="#a855f7" filter="url(#glow)" d="M215 62 c0 -24 -32 -24 -32 0 c0 32 50 32 50 -5 c0 -42 -68 -42 -68 5 c0 52 88 52 88 -7"/>
  <path class="curl c2" stroke="#ff4fa3" filter="url(#glow)" d="M685 62 c0 -24 32 -24 32 0 c0 32 -50 32 -50 -5 c0 -42 68 -42 68 5 c0 52 -88 52 -88 -7"/>

  <text class="title" filter="url(#glow)"><textPath href="#titlePath" startOffset="50%" text-anchor="middle">Javeria Khan</textPath></text>
  <text class="sub" x="450" y="178" text-anchor="middle">BSAI student // Python, Java, C++ // curly code, twisty ideas<tspan class="cur">_</tspan></text>

  <g>
    <path class="flow" stroke="url(#pk)" opacity=".9" d="M-240 205 q60 -55 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0"/>
    <path class="flow f2" stroke="#ffd1ea" opacity=".35" d="M-240 225 q60 -45 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
